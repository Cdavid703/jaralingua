      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8f5f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#03122c" flood-opacity=".28"/>
    </filter>
  </defs>
