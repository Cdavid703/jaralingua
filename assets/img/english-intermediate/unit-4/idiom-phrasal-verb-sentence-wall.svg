<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Live idiom and phrasal verb sentence wall</title>
  <desc id="desc">A classroom dashboard where a teacher opens an expression and students send example sentences to a live wall.</desc>
  <defs>
