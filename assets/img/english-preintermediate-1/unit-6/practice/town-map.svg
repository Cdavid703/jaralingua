<svg viewBox="0 0 700 650" role="img" aria-labelledby="town-map-title town-map-description" xmlns="http://www.w3.org/2000/svg"><title id="town-map-title">Fictional town map with starting point beside the tourist office</title><desc id="town-map-description">North is at the top. Oak Street runs north to south. Hill Street, Central Street and River Street run west to east, from top to bottom. The museum, park and tourist office are west of Oak Street; the station, market and café are east, in that order from north to south. The red starting point is on Oak Street beside the tourist office. No route is marked.</desc><rect x="5" y="5" width="690" height="640" rx="20" fill="#eef4ff" stroke="#b4c9e8"/><g fill="#d6e2f2"><rect x="335" y="45" width="30" height="565"/><rect x="25" y="185" width="650" height="30"/><rect x="25" y="385" width="650" height="30"/><rect x="25" y="585" width="650" height="30"/></g><g stroke="#123b8f" stroke-width="2"><rect x="40" y="55" width="220" height="95" rx="14" fill="white"/><rect x="440" y="55" width="220" height="95" rx="14" fill="white"/><rect x="40" y="255" width="220" height="95" rx="14" fill="#fff1d6"/><rect x="440" y="255" width="220" height="95" rx="14" fill="white"/><rect x="40" y="455" width="220" height="95" rx="14" fill="white"/><rect x="440" y="455" width="220" height="95" rx="14" fill="#fff1d6"/></g><g fill="#071f4f" font-family="Arial, sans-serif" font-size="34" font-weight="700" text-anchor="middle"><text x="150" y="115">Museum</text><text x="550" y="115">Station</text><text x="150" y="315">Park</text><text x="550" y="315">Market</text><text x="150" y="493"><tspan x="150">Tourist</tspan><tspan x="150" dy="34">Office</tspan></text><text x="550" y="515">Café</text></g><g fill="#071f4f" font-family="Arial, sans-serif" font-size="28"><text x="30" y="178">Hill Street</text><text x="30" y="378">Central Street</text><text x="30" y="578">River Street</text><text x="380" y="636">Oak Street</text><text x="565" y="37">North ↑</text></g><circle cx="350" cy="500" r="9" fill="#d7193f"/><text x="375" y="510" fill="#d7193f" font-family="Arial, sans-serif" font-size="24" font-weight="700">Start</text></svg>