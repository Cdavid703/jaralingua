<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Map check for a directions video listening activity</title>
  <desc id="desc">A clean 2D city map showing a start point, a bank, a library, a school, a cafe, a supermarket, and a bus stop with a route to the library.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0f172a" flood-opacity=".16"/>
    </filter>
    <style>
      .street{fill:none;stroke:#cbd5e1;stroke-width:88;stroke-linecap:round;stroke-linejoin:round}
      .street-line{fill:none;stroke:#f8fafc;stroke-width:6;stroke-dasharray:22 24;stroke-linecap:round}
      .street-name{font:800 22px Arial, sans-serif;fill:#475569;letter-spacing:.5px}
      .building{filter:url(#shadow)}
      .label{font:900 25px Arial, sans-serif;fill:#0f172a}
      .small{font:700 18px Arial, sans-serif;fill:#64748b}
      .icon-line{stroke:#fff;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .route{fill:none;stroke:#e11d48;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:28 18}
      .route-halo{fill:none;stroke:#fff;stroke-width:25;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
      .pin{filter:url(#shadow)}
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M90 146 C250 128 355 132 520 146 C725 164 890 150 1188 146" class="street"/>
  <path d="M90 360 H1190" class="street"/>
  <path d="M90 574 C310 560 484 584 670 574 C855 566 978 572 1190 574" class="street"/>
  <path d="M252 80 V644" class="street"/>
  <path d="M640 80 V644" class="street"/>
  <path d="M1010 80 V644" class="street"/>
  <path d="M90 146 C250 128 355 132 520 146 C725 164 890 150 1188 146" class="street-line"/>
  <path d="M90 360 H1190" class="street-line"/>
  <path d="M90 574 C310 560 484 584 670 574 C855 566 978 572 1190 574" class="street-line"/>
  <path d="M252 80 V644" class="street-line"/>
  <path d="M640 80 V644" class="street-line"/>
  <path d="M1010 80 V644" class="street-line"/>

  <text x="520" y="328" class="street-name">GREEN STREET</text>
  <text x="675" y="118" class="street-name" transform="rotate(90 675 118)">MAPLE AVE</text>

  <g class="building" transform="translate(116 190)">
    <rect width="206" height="116" rx="22" fill="#1d4ed8"/>
    <path d="M50 82h106M62 62h82M72 42h62" class="icon-line"/>
    <text x="32" y="152" class="label">LIBRARY</text>
    <text x="32" y="178" class="small">destination</text>
  </g>

  <g class="building" transform="translate(370 190)">
    <rect width="190" height="116" rx="22" fill="#0f766e"/>
    <path d="M48 82h94M58 82V48M82 82V48M118 82V48M42 48h106L95 24z" class="icon-line"/>
    <text x="44" y="152" class="label">BANK</text>
    <text x="44" y="178" class="small">turn left here</text>
  </g>

  <g class="building" transform="translate(116 414)">
    <rect width="206" height="116" rx="22" fill="#f97316"/>
    <path d="M48 78c22-34 92-34 114 0M66 78v-28M144 78v-28" class="icon-line"/>
    <text x="56" y="152" class="label">CAFE</text>
    <text x="34" y="178" class="small">across from library</text>
  </g>

  <g class="building" transform="translate(370 414)">
    <rect width="190" height="116" rx="22" fill="#7c3aed"/>
    <path d="M50 84h90V48H50zM70 48V30h50v18" class="icon-line"/>
    <text x="44" y="152" class="label">SCHOOL</text>
    <text x="44" y="178" class="small">next to library</text>
  </g>

  <g class="building" transform="translate(780 190)">
    <rect width="230" height="116" rx="22" fill="#16a34a"/>
    <path d="M56 78h108l14-44H48zM78 88a10 10 0 1 0 0 .1M156 88a10 10 0 1 0 0 .1" class="icon-line"/>
    <text x="18" y="152" class="label">SUPERMARKET</text>
    <text x="48" y="178" class="small">near the bus stop</text>
  </g>

  <g class="building" transform="translate(818 414)">
    <rect width="194" height="116" rx="22" fill="#0284c7"/>
    <path d="M54 78h86V44H54zM66 78v18M128 78v18M66 60h62" class="icon-line"/>
    <text x="38" y="152" class="label">BUS STOP</text>
    <text x="10" y="178" class="small">in front of supermarket</text>
  </g>

  <path d="M640 624 V360 H468 H220" class="route-halo"/>
  <path d="M640 624 V360 H468 H220" class="route"/>
  <circle cx="640" cy="624" r="24" fill="#fff" stroke="#e11d48" stroke-width="8" class="pin"/>
  <text x="575" y="682" class="label">START</text>
  <circle cx="220" cy="360" r="26" fill="#e11d48" stroke="#fff" stroke-width="8" class="pin"/>
  <text x="150" y="356" class="small" fill="#fff">END</text>

  <g transform="translate(830 610)">
    <rect x="0" y="-46" width="366" height="74" rx="22" fill="#ffffff" opacity=".94" filter="url(#shadow)"/>
    <circle cx="38" cy="-9" r="13" fill="#e11d48"/>
    <text x="62" y="-2" class="small">Route: go straight, turn left at the bank, walk one block.</text>
  </g>
</svg>
