add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://accounts.google.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com https://alcdn.msauth.net; frame-src https://accounts.google.com https://login.microsoftonline.com https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com https://*.spotify.com; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://accounts.google.com https://login.microsoftonline.com https://graph.microsoft.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' data: https://accounts.google.com https://*.googleusercontent.com; style-src 'self' https://accounts.google.com; script-src 'self' https://accounts.google.com https://alcdn.msauth.net; frame-src https://accounts.google.com https://login.microsoftonline.com https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com https://*.spotify.com; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://accounts.google.com https://login.microsoftonline.com https://graph.microsoft.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests; report-uri /csp-report" always;
