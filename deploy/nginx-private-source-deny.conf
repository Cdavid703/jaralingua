# Include in every public JaraLingua server block. These paths and source
# formats contain backend logic, private data, deployment files, and question
# bank documentation; none are public web assets.
location ~ /\.(?!well-known/) {
    deny all;
    access_log off;
    log_not_found off;
}

location ~ ^/(server|data|tools|deploy|tmp)(/|$) {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* \.(local\.json|env|py|md|ps1|mjs|bak|sqlite|db|log)$ {
    deny all;
    access_log off;
    log_not_found off;
}
