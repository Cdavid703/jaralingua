# Include inside the jaralingua.com HTTPS server block.
#
# IMPORTANT: /internal/pronunciation/audio-inspect is deliberately NOT proxied.
# It is a loopback-only service contract for the progress API.
location = /api/french8/pronunciation-assessment {
    client_max_body_size 15m;
    client_body_timeout 30s;
    proxy_pass http://127.0.0.1:8020;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Jaralingua-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 45s;
    proxy_read_timeout 180s;
    proxy_request_buffering on;
    proxy_next_upstream off;
}

location = /api/french8/pronunciation-health {
    proxy_pass http://127.0.0.1:8020;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    access_log off;
    limit_except GET { deny all; }
}
