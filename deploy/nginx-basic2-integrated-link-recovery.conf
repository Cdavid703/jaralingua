# Copied links may append U+2060 (WORD JOINER) and U+FFFC (OBJECT REPLACEMENT).
# Nginx matches the decoded URI; match only these UTF-8 bytes after this page.
location ~ "^/ingles/basico-2/basic-course-2-integrated-task[.]html(?:\xE2\x81\xA0|\xEF\xBF\xBC)+$" {
    return 302 /ingles/basico-2/basic-course-2-integrated-task.html$is_args$args;
}
