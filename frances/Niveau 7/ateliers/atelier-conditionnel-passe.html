<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="8; url=../../Niveau%208/ateliers-activites.html#theme-01">
  <title>Atelier transféré - Conditionnel passé</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png" sizes="96x96">
  <link href="../../../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../../../assets/vendor/fonts/jaralingua-fonts.css" rel="stylesheet">
  <style>
    :root{--blue:#1f4e8c;--blue-dark:#15345d;--red:#d62839;--text:#243044;--muted:#718096;--shadow:0 22px 55px rgba(20,40,80,.13)}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;font-family:"Nunito",sans-serif;color:var(--text);background:linear-gradient(135deg,#eef5ff,#fff0f2)}
    h1{font-family:"Montserrat",sans-serif;color:var(--blue-dark);font-weight:900;letter-spacing:-.04em}
    .transfer-card{width:min(920px,100%);background:#fff;border-radius:32px;box-shadow:var(--shadow);padding:clamp(1.5rem,4vw,3rem)}
    .badge{display:inline-flex;align-items:center;gap:.5rem;border-radius:999px;background:rgba(214,40,57,.1);color:var(--red);font-weight:900;padding:.55rem .85rem}
    p{color:var(--muted);font-size:1.1rem;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.5rem}
    .btn-main,.btn-soft{border-radius:999px;font-weight:900;padding:.85rem 1.1rem;text-decoration:none;display:inline-flex;align-items:center;gap:.45rem}
    .btn-main{background:linear-gradient(135deg,var(--blue),var(--blue-dark));color:#fff}.btn-soft{border:2px solid rgba(31,78,140,.18);color:var(--blue-dark);background:#fff}
  </style>
</head>
<body>
  <main class="transfer-card">
    <span class="badge"><i class="bi bi-arrow-up-right-circle-fill"></i>Atelier déplacé</span>
    <h1>L’atelier du conditionnel passé est maintenant en Niveau 8.</h1>
    <p>La version du Niveau 7 a été retirée pour éviter les doublons. La pratique actuelle se trouve dans le bloc d’activités du thème 01 du Niveau 8.</p>
    <div class="actions">
      <a class="btn-main" href="../../Niveau%208/ateliers-activites.html#theme-01"><i class="bi bi-ui-checks"></i>Ouvrir l’atelier en Niveau 8</a>
      <a class="btn-soft" href="../ateliers-activites.html"><i class="bi bi-arrow-left"></i>Retour aux ateliers du Niveau 7</a>
    </div>
  </main>
</body>
</html>
