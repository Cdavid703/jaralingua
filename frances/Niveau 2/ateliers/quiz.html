  <script>
    (function(){
      const params = new URLSearchParams(location.search);
      const key = params.get("activite") || "diagnostic-routine-a12";

      };
      document.title = `${activity.title} | Français Niveau 2`;
      document.getElementById("quizHero").style.setProperty("--hero-image", `url('/frances/Niveau%202/img/ateliers/${images[key] || "diagnostic-routine.png"}')`);
      document.getElementById("quizTitle").textContent = activity.title;
      document.getElementById("quizLead").textContent = activity.lead;
      document.getElementById("quizTheme").textContent = activity.theme;
      document.getElementById("quizSubtitle").textContent = activity.type;
      document.getElementById("quizType").textContent = activity.type;
      document.getElementById("crumbTitle").textContent = activity.title;
      window.quizData = activity.questions || [];
      document.querySelector("[data-quiz-score]").textContent = `0 / ${window.quizData.length}`;
    })();
