<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expressions idiomatiques | Français Niveau 1</title><link href="../../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet"><link href="../../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet"><link href="../../assets/vendor/fonts/jaralingua-fonts.css" rel="stylesheet"><link href="assets/niveau1.css?v=20260625" rel="stylesheet"></head><body><nav class="navbar fixed-top"><div class="container"><a class="navbar-brand" href="index.html"><img class="brand-logo" src="../../assets/img/jaralingua-logo.png" alt="JaraLingua"><span>Français · Niveau 1</span></a></div></nav><header class="hero lesson-hero"><div class="container"><span class="badge-course">Français vivant A1</span><h1>Expressions idiomatiques</h1><p class="hero-text">Des expressions courtes et naturelles liées aux cinq thèmes du cours.</p></div></header><main><section><div class="container"><div class="theme-grid" id="expressions"></div></div></section></main><footer class="footer"><div class="container"><a href="index.html">← Retour au portail</a></div></footer><script>const data=[["Ça va ?","Comment allez-vous ?","— Salut, ça va ? — Oui, très bien !"],["Enchanté(e)","Formule utilisée lors d’une première rencontre.","Je m’appelle Lina. Enchantée !"],["Ça marche !","D’accord ; c’est entendu.","On travaille à dix heures ? Ça marche !"],["Avoir faim","Ressentir le besoin de manger.","J’ai faim, allons au café."],["Avoir soif","Ressentir le besoin de boire.","Après le sport, nous avons soif."],["Être en retard","Arriver après l’heure prévue.","Paul est en retard pour le cours."],["Faire attention","Être attentif ou prudent.","Faites attention à la prononciation."],["Donner un coup de main","Aider quelqu’un.","Je donne un coup de main à mon frère."],["Être de bonne humeur","Se sentir joyeux et positif.","Sofia est de bonne humeur aujourd’hui."],["Se ressembler comme deux gouttes d’eau","Être physiquement très semblables.","Les deux sœurs se ressemblent comme deux gouttes d’eau."]];expressions.innerHTML=data.map((x,i)=>`<article class="content-card"><span class="skill-pill">Expression ${i+1}</span><h2 class="h4 mt-3">${x[0]}</h2><p>${x[1]}</p><div class="callout">${x[2]}</div></article>`).join('');</script></body></html>
