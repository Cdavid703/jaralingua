<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ma carte d’identité | Français Niveau 1</title><link href="../../../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet"><link href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet"><link href="../../../assets/vendor/fonts/jaralingua-fonts.css" rel="stylesheet"><link href="../assets/niveau1.css?v=20260624-hero-bg" rel="stylesheet"></head><body><nav class="navbar fixed-top"><div class="container"><a class="navbar-brand" href="../index.html"><img class="brand-logo" src="../../../assets/img/jaralingua-logo.png" alt="JaraLingua"><span>Français · Niveau 1</span></a><a class="nav-link" href="../ateliers-activites.html">Ateliers</a></div></nav><header class="hero lesson-hero" style="--hero-image:url('/frances/Niveau%201/img/ateliers/carte-identite-creative-a1.png')"><div class="container"><span class="badge-course">Production créative</span><h1>Ma carte d’identité</h1><p class="hero-text">Créez une présentation personnelle en français. Cette activité évalue la communication, pas une règle de grammaire isolée.</p></div></header><main><section><div class="container"><div class="lesson-layout"><form class="content-card" id="identityForm"><h2>Mes informations</h2><div class="row g-3"><label class="col-md-6">Prénom<input class="form-control" name="prenom" required></label><label class="col-md-6">Nom<input class="form-control" name="nom" required></label><label class="col-md-4">Âge<input class="form-control" name="age" type="number" min="12" max="99"></label><label class="col-md-4">Nationalité<input class="form-control" name="nationalite"></label><label class="col-md-4">Ville<input class="form-control" name="ville"></label><label class="col-12">Langues parlées<input class="form-control" name="langues"></label><label class="col-12">Une chose que j’aime<textarea class="form-control" name="aime" rows="2"></textarea></label></div><button class="btn-main mt-4" type="submit">Créer ma présentation</button></form><aside class="lesson-aside"><article class="content-card" id="identityPreview"><span class="skill-pill">Carte A1</span><h2 id="previewName">Votre nom</h2><p id="previewText">Complétez le formulaire pour construire votre présentation.</p><button class="btn-soft" type="button" onclick="window.print()"><i class="bi bi-printer"></i> Imprimer / PDF</button></article></aside></div></div></section></main><script>document.getElementById('identityForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.currentTarget));document.getElementById('previewName').textContent=`${d.prenom} ${d.nom}`;document.getElementById('previewText').textContent=`Bonjour ! Je m’appelle ${d.prenom} ${d.nom}. J’ai ${d.age||'…'} ans. Je suis ${d.nationalite||'…'} et j’habite à ${d.ville||'…'}. Je parle ${d.langues||'…'}. J’aime ${d.aime||'…'}. Enchanté(e) !`;});</script><script src="../assets/niveau1.js?v=20260624-audit-nav"></script>  <script src="../../../assets/js/google-auth-config.js"></script>
