<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qui est-ce ? | Français Niveau 1</title><link href="../../../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet"><link href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet"><link href="../../../assets/vendor/fonts/jaralingua-fonts.css" rel="stylesheet"><link href="../assets/niveau1.css?v=20260625" rel="stylesheet"></head><body>
<nav class="navbar fixed-top"><div class="container"><a class="navbar-brand" href="../index.html"><img class="brand-logo" src="../../../assets/img/jaralingua-logo.png" alt="JaraLingua"><span>Français · Niveau 1</span></a><a class="nav-link" href="../ateliers-activites.html">Ateliers</a></div></nav>
<header class="hero lesson-hero"><div class="container"><span class="badge-course">Jeu de description</span><h1>Qui est-ce ?</h1><p class="hero-text">Lisez les indices et trouvez la personne. Utilisez ensuite les mêmes structures pour créer votre propre devinette.</p></div></header>
<main><section><div class="container"><article class="content-card"><div class="d-flex justify-content-between gap-3"><div><p class="section-kicker">Portrait secret</p><h2 id="clue"></h2></div><button id="newRound" class="btn-soft" type="button">Nouveau portrait</button></div><div id="people" class="theme-grid mt-4"></div><p id="result" class="feedback-box" aria-live="polite">Choisissez une personne.</p></article></div></section></main>
<script>
const roster=[{n:"Amélie",c:"portrait-a",d:"Elle a les cheveux noirs et bouclés. Elle est souriante."},{n:"Lucas",c:"portrait-l",d:"Il a les cheveux roux. Il est calme et porte des lunettes."},{n:"Nora",c:"portrait-n",d:"Elle a les cheveux longs et bruns. Elle est sportive."},{n:"Hugo",c:"portrait-h",d:"Il a les cheveux courts et noirs. Il est drôle."}];
const peopleGrid=document.getElementById("people"), clueText=document.getElementById("clue"), resultBox=document.getElementById("result");
let secret; function round(){secret=roster[Math.floor(Math.random()*roster.length)];clueText.textContent=secret.d;resultBox.textContent="Choisissez une personne.";}
peopleGrid.innerHTML=roster.map((p,i)=>`<button class="content-card text-center" data-i="${i}" type="button"><span class="portrait-placeholder ${p.c}">${p.n.charAt(0)}</span><strong>${p.n}</strong></button>`).join("");
document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const p=roster[Number(b.dataset.i)];resultBox.textContent=p===secret?`Bravo ! C’est ${p.n}.`:`Ce n’est pas ${p.n}. Relisez les indices.`;}); document.getElementById("newRound").onclick=round; round();
</script></body></html>
