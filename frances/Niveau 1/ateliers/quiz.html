        }

      if (key === "present-indicatif") {
        material.innerHTML = `<article class="content-card activity-material">
          <p class="section-kicker">Avant de répondre</p>
          <h2 class="h4">Le présent sert à parler du réel</h2>
          <p class="section-text">Utilisez le présent pour une action actuelle, une habitude ou une vérité générale. Pour nier, placez <strong>ne / n’</strong> avant le verbe et <strong>pas</strong> après le verbe.</p>
          <div class="grammar-table">
            <div><b>Affirmation</b><span>Je parle français.</span></div>
            <div><b>Négation</b><span>Je <strong>ne parle pas</strong> allemand.</span></div>
            <div><b>Question</b><span>Est-ce que tu habites à Medellín ?</span></div>

          <p class="section-kicker">Avant de répondre</p>
          <h2 class="h4">Une action qui se passe maintenant</h2>
          <p class="section-text">Le présent progressif se forme avec <strong>être en train de + infinitif</strong>. Il sert à insister sur l’action en cours : <em>Elle est en train de lire</em>.</p>

            <div><b>Affirmatif</b><span>Je suis en train de travailler.</span></div>
            <div><b>Négatif</b><span>Je ne suis pas en train de dormir.</span></div>
            <div><b>Question</b><span>Est-ce que tu es en train d’écouter ?</span></div>

        material.innerHTML = `<article class="content-card activity-material">
          <p class="section-kicker">Avant de répondre</p>
          <h2 class="h4">Profession + activité</h2>
          <p class="section-text">Pour présenter un métier, utilisez souvent <strong>être + profession</strong> : <em>Elle est médecin</em>. Pour parler de l’action, utilisez un verbe : <em>Elle soigne les patients</em>.</p>
          <div class="grammar-table">
            <div><b>Profession</b><span>Il est professeur.</span></div>
            <div><b>Lieu</b><span>Il travaille dans une école.</span></div>
            <div><b>Activité</b><span>Il explique la leçon.</span></div>
          </div>
          <a class="btn-soft" href="../themes/description-personnalite.html"><i class="bi bi-book"></i> Revoir le thème 06</a>

          <h2 class="h4">Décrire un logement avec précision</h2>
          <p class="section-text">Observez la pièce, nommez les objets, puis situez-les avec une préposition. Pour parler de l’existence, utilisez <strong>il y a</strong>. Pour l’absence, utilisez <strong>il n’y a pas de</strong>.</p>

  <script>
    (function(){
      function readUser(){
        const keys = ["jaralingua_google_user","jaralingua_microsoft_user"];
        for (const key of keys) {
          try {
            const user = JSON.parse(sessionStorage.getItem(key) || "null");
            if (user && (!user.exp || Date.now() / 1000 <= user.exp)) return user;
          } catch (_error) {}
        }
        return null;
      }
      function normalizeEmail(email){ return String(email || "").trim().toLowerCase(); }
      function userId(user){ return (user && (user.sub || user.email)) || ""; }
      function canSeeTranscript(){
        const user = readUser();
        if (!user) return false;
        const email = normalizeEmail(user.email);
        if (email === "cdavid.jaramillo@gmail.com" || email === "lcvelasqueza@correo.iue.edu.co" || email === "velasquez.luisac@gmail.com") return true;
        try {
          const requests = JSON.parse(localStorage.getItem("jaralingua_role_requests") || "[]");
          const id = userId(user);
          return Array.isArray(requests) && requests.some((request) =>
            request.status === "approved" &&
            (request.role === "teacher" || request.role === "admin") &&
            (request.id === id || normalizeEmail(request.email) === email)
          );
        } catch (_error) {
          return false;
        }
      }
      function updateTranscriptAccess(){ document.body.classList.toggle("can-view-transcripts", canSeeTranscript()); }
      document.addEventListener("click", (event) => {
        const button = event.target.closest("#downloadTranscriptBtn");
        if (!button || !canSeeTranscript()) return;
        const activity = window.currentFrench1Activity?.item;
        if (!activity?.transcript) return;
        const safeTitle = activity.title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
        downloadTranscriptPdf(activity.title, activity.transcript, `transcription-niveau1-${safeTitle}.pdf`);
      });
      updateTranscriptAccess();
      window.addEventListener("storage", updateTranscriptAccess);
      window.addEventListener("focus", updateTranscriptAccess);
      let checks = 0;
      const timer = setInterval(() => { updateTranscriptAccess(); checks += 1; if (checks > 12) clearInterval(timer); }, 800);
    })();
  </script>
