<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Atelier interactif de Français Niveau 1."><title>Atelier | Français Niveau 1</title><link rel="icon" href="/favicon.ico"><link href="../../../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet"><link href="../../../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet"><link href="../../../assets/vendor/fonts/jaralingua-fonts.css" rel="stylesheet"><link href="../assets/niveau1.css?v=20260624" rel="stylesheet"></head><body>
<nav class="navbar fixed-top"><div class="container"><a class="navbar-brand" href="../index.html"><img class="brand-logo" src="../../../assets/img/jaralingua-logo.png" alt="JaraLingua"><span>Français · Niveau 1</span></a><div class="d-flex"><a class="nav-link" href="../themes-du-cours.html">Thèmes</a><a class="nav-link active" href="../ateliers-activites.html">Ateliers</a></div></div></nav>
<header class="hero lesson-hero"><div class="container"><div class="breadcrumb-row"><a href="../index.html">Accueil</a><span>›</span><a href="../ateliers-activites.html">Ateliers</a><span>›</span><span id="quizCrumb">Activité</span></div><span class="badge-course" id="quizTheme">Français A1.1</span><h1 id="quizTitle">Atelier interactif</h1><p class="hero-text" id="quizDescription">Choisissez la bonne réponse et lisez la correction.</p></div></header>
<main><section><div class="container"><div class="quiz-shell"><div class="d-flex justify-content-between align-items-center gap-3 mb-2"><strong id="quizSkill">Pratique</strong><strong data-quiz-score>0 point</strong></div><div class="quiz-progress" aria-label="Progression"><span data-quiz-progress></span></div><div id="activityMaterial"></div><div data-quiz></div><div class="text-center mt-4"><a class="btn-soft" href="../ateliers-activites.html">Retour aux activités</a></div></div></div></section></main>
<footer class="footer"><div class="container"><a href="../ateliers-activites.html">← Tous les ateliers</a></div></footer>
<script src="../assets/quiz-catalog.js?v=20260625"></script><script src="../assets/original-banks.js?v=20260625"></script><script src="../assets/expanded-catalog.js?v=20260625b"></script><script>
(function(){
  const key=new URLSearchParams(location.search).get('activite')||'alphabet-sons';
  const item=window.quizCatalog[key]||window.quizCatalog['alphabet-sons'];
  const original=window.french1OriginalBanks&&window.french1OriginalBanks[key];
  const expanded=window.french1ExpandedActivities&&window.french1ExpandedActivities[key];
  let questions=!expanded&&original&&original.length?original.slice():item.questions.slice();
  for(let i=questions.length-1;i>0;i-=1){const j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]];}
  if(['articles-definis','famille-relations','adjectifs-possessifs'].includes(key)) questions=questions.slice(0,10);
  window.quizData=questions;
  document.title=item.title+' | Français Niveau 1';
  document.getElementById('quizTitle').textContent=item.title;
  document.getElementById('quizCrumb').textContent=item.title;
  document.getElementById('quizTheme').textContent=item.theme;
  document.getElementById('quizDescription').textContent=item.description;
  document.getElementById('quizSkill').textContent=item.skill;
  const material=document.getElementById('activityMaterial');
  if(item.audio) material.innerHTML=`<article class="content-card activity-material"><h2 class="h4">Audio de l’activité</h2><p>Écoutez le document complet avant de répondre. Vous pouvez modifier la vitesse.</p><audio controls preload="metadata" class="w-100" src="${item.audio}"></audio></article>`;
  if(item.reading) material.innerHTML=`<article class="content-card activity-material reading-text"><p class="section-kicker">Texte à lire</p><h2 class="h4">${item.title}</h2><p>${item.reading}</p></article>`;
})();
</script><script src="../assets/quiz-engine.js?v=20260625"></script><script src="../assets/niveau1.js?v=20260625"></script></body></html>
