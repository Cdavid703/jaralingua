<body>
  <nav class="navbar fixed-top">
    <div class="container">
      <a class="navbar-brand" href="../index.html"><img class="brand-logo" src="../../../assets/img/jaralingua-logo.png" alt="JaraLingua"><span>Français · Niveau 1</span></a>

  <header class="hero lesson-hero" style="--hero-image:url('/frances/Niveau%201/img/ateliers/atelier-alphabet-sons.png')">
    <div class="container">
      <div class="breadcrumb-row"><a href="../index.html">Accueil</a><span>›</span><a href="../ateliers-activites.html">Ateliers</a><span>›</span><span id="quizCrumb">Activité</span></div>

      <p class="hero-text" id="quizDescription">Choisissez la bonne réponse et lisez la correction.</p>

  <main>
    <section>
      <div class="container">
        <div class="quiz-shell">

            <strong id="quizSkill">Pratique</strong>
            <strong data-quiz-score>0 point</strong>
          </div>
          <div class="quiz-progress" aria-label="Progression"><span data-quiz-progress></span></div>
          <div id="activityMaterial"></div>
          <div data-quiz></div>
          <div class="text-center mt-4"><a class="btn-soft" href="../ateliers-activites.html">Retour aux activités</a></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer"><div class="container"><a href="../ateliers-activites.html">← Tous les ateliers</a></div></footer>

  <script src="../../../assets/js/transcript-pdf.js"></script>
  <script src="../assets/quiz-catalog.js?v=20260624-numbers-fix"></script>
  <script src="../assets/original-banks.js?v=20260624-numbers-fix"></script>
  <script src="../assets/expanded-catalog.js?v=20260626-transcripts"></script>
  <script>
    (function(){
      const key = new URLSearchParams(location.search).get("activite") || "alphabet-sons";
      const item = window.quizCatalog[key] || window.quizCatalog["alphabet-sons"];
      const activityHeroImages = {
        "alphabet-sons":"atelier-alphabet-sons.png",
        "ecoute-nombres-1-20":"atelier-ecoute-nombres.png",
        "ecoute-nombres-1-100":"atelier-nombres-aleatoires-100.png",
        "nombres-dates":"atelier-nombres-aleatoires-100.png",
        "premiere-rencontre":"atelier-premiere-rencontre.png",
        "articles-definis":"atelier-articles-definis.png",
        "lecture-premiers-contacts":"lecture-premiers-contacts.png",
        "present-indicatif":"atelier-present-indicatif.png",
        "negation-present":"atelier-negation-present.png",
        "questions-present":"atelier-questions-present.png",
        "lecture-present-classe":"lecture-present-classe.png",
        "production-routine-present":"production-routine-present.png",
        "conjugaison-er":"atelier-conjugaison-er.png",
        "radical-terminaison":"atelier-conjugaison-er.png",
        "verbes-er-contexte":"lecture-routine-malik.png",
        "ecoute-verbes-er":"ecoute-routine-camille.png",
        "lecture-verbes-er":"lecture-routine-malik.png",
        "verbe-etre":"atelier-verbe-etre.png",
        "verbe-avoir":"atelier-verbe-avoir.png",
        "verbe-aller":"atelier-verbe-aller.png",
        "verbe-faire":"atelier-verbe-faire.png",
        "informations-personnelles":"carte-identite-creative-a1.png",
        "ecoute-verbes-essentiels":"ecoute-samedi-lyon.png",
        "lecture-verbes-essentiels":"lecture-sortie-musee.png",
        "famille-relations":"atelier-famille-vocabulaire.png",
        "adjectifs-possessifs":"atelier-adjectifs-possessifs.png",
        "arbre-familial":"atelier-arbre-familial.png",
        "ecoute-ma-famille":"ecoute-dejeuner-famille.png",
        "lecture-famille":"lecture-famille-lea.png",
        "accord-adjectifs":"atelier-accord-adjectifs.png",
        "portrait-guide":"atelier-portrait-guide.png",
        "qui-est-ce-description":"qui-est-ce-portraits-a1.png",
        "ecoute-portrait":"ecoute-portrait-sofia.png",
        "lecture-description":"lecture-amie-ines.png"
      };
      const original = window.french1OriginalBanks && window.french1OriginalBanks[key];
      const expanded = window.french1ExpandedActivities && window.french1ExpandedActivities[key];
      let questions = !expanded && original && original.length ? original.slice() : item.questions.slice();

      for (let i = questions.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [questions[i], questions[j]] = [questions[j], questions[i]];
      }
      if (["articles-definis","famille-relations","adjectifs-possessifs"].includes(key)) questions = questions.slice(0,10);
      window.quizData = questions;
      window.currentFrench1Activity = { key, item };

      document.title = item.title + " | Français Niveau 1";
      document.getElementById("quizTitle").textContent = item.title;
      document.getElementById("quizCrumb").textContent = item.title;
      document.getElementById("quizTheme").textContent = item.theme;
      document.getElementById("quizDescription").textContent = item.description;
      document.getElementById("quizSkill").textContent = item.skill;
      document.querySelector(".lesson-hero").style.setProperty("--hero-image", `url('/frances/Niveau%201/img/ateliers/${activityHeroImages[key] || "atelier-alphabet-sons.png"}?v=20260624-activity-images')`);

      const material = document.getElementById("activityMaterial");
      if (item.audio) {
        material.innerHTML = `<article class="content-card activity-material">
          <div class="d-flex flex-wrap gap-3 align-items-center justify-content-between">
            <div>
              <h2 class="h4">Audio de l’activité</h2>
              <p>Écoutez le document complet avant de répondre. Vous pouvez modifier la vitesse.</p>
              <p class="teacher-note mb-0">Accès professeur/admin détecté : la transcription PDF est disponible.</p>
            </div>
            <button type="button" class="btn-soft teacher-only" id="downloadTranscriptBtn"><i class="bi bi-file-earmark-pdf"></i> Télécharger la transcription</button>
          </div>
          <audio controls preload="metadata" class="w-100 mt-3" src="${item.audio}"></audio>
        </article>`;
      }
      if (item.reading) {
        material.innerHTML = `<article class="content-card activity-material reading-text"><p class="section-kicker">Texte à lire</p><h2 class="h4">${item.title}</h2><p>${item.reading}</p></article>`;
      }
    })();
  </script>
  <script src="../assets/quiz-engine.js?v=20260625"></script>
  <script src="../assets/niveau1.js?v=20260624-alphabet-nz-fix"></script>
  <script>
    (function(){
      function readUser(){
        const keys = ["jaralingua_google_user","jaralingua_microsoft_user"];
        for (const key of keys) {
          try {
            const user = JSON.parse(sessionStorage.getItem(key) || "null");
            if (user && (!user.exp || Date.now() / 1000 <= user.exp)) return user;
          } catch (_error) {}
        }
        return null;
      }
      function normalizeEmail(email){ return String(email || "").trim().toLowerCase(); }
      function userId(user){ return (user && (user.sub || user.email)) || ""; }
      function canSeeTranscript(){
        const user = readUser();
        if (!user) return false;
        const email = normalizeEmail(user.email);
        if (email === "cdavid.jaramillo@gmail.com" || email === "lcvelasqueza@correo.iue.edu.co") return true;
        try {
          const requests = JSON.parse(localStorage.getItem("jaralingua_role_requests") || "[]");
          const id = userId(user);
          return Array.isArray(requests) && requests.some((request) =>
            request.status === "approved" &&
            (request.role === "teacher" || request.role === "admin") &&
            (request.id === id || normalizeEmail(request.email) === email)
          );
        } catch (_error) {
          return false;
        }
      }
      function updateTranscriptAccess(){ document.body.classList.toggle("can-view-transcripts", canSeeTranscript()); }
      document.addEventListener("click", (event) => {
        const button = event.target.closest("#downloadTranscriptBtn");
        if (!button || !canSeeTranscript()) return;
        const activity = window.currentFrench1Activity?.item;
        if (!activity?.transcript) return;
        const safeTitle = activity.title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
        downloadTranscriptPdf(activity.title, activity.transcript, `transcription-niveau1-${safeTitle}.pdf`);
      });
      updateTranscriptAccess();
      window.addEventListener("storage", updateTranscriptAccess);
      window.addEventListener("focus", updateTranscriptAccess);
      let checks = 0;
      const timer = setInterval(() => { updateTranscriptAccess(); checks += 1; if (checks > 12) clearInterval(timer); }, 800);
    })();
  </script>
</body>
</html>
