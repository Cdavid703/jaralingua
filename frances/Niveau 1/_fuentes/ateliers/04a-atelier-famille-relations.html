<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller: La Famille et les Relations</title>
<style>
    /* Style général pour le conteneur */
    .quiz-container {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        padding: 25px;
        border-radius: 10px;
        max-width: 700px;
        margin: auto;
        border: 1px solid #ddd;
    }
    /* Style pour l'explication initiale */
    .quiz-explanation {
        font-size: 1em;
        color: #333;
        margin-bottom: 25px;
        line-height: 1.5;
        border-left: 4px solid #007bff;
        padding-left: 15px;
        background-color: #e7f3ff;
        padding: 10px 15px;
    }
    /* Style pour chaque bloc de question */
    .question-block {
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid #eee;
        border-radius: 5px;
        background-color: #ffffff;
    }
    .question-block p {
        font-weight: bold;
        margin-bottom: 12px;
        font-size: 1.1em;
    }
    /* Style pour les options de réponse */
    .options label {
        display: block;
        margin-bottom: 8px;
        cursor: pointer;
        padding: 10px;
        border-radius: 5px;
        transition: background-color 0.2s;
        border: 1px solid #ddd;
    }
    .options label:hover {
        background-color: #f0f0f0;
    }
    .options input[type="radio"] {
        margin-right: 10px;
    }
    /* Style pour le bouton de résultats */
    #submit-btn {
        display: block; width: 100%; padding: 15px; font-size: 1.2em; font-weight: bold;
        color: white; background-color: #28a745; border: none; border-radius: 5px;
        cursor: pointer; margin-top: 20px; transition: background-color 0.3s;
    }
    #submit-btn:hover { background-color: #218838; }
    
    /* Styles pour les résultats */
    #results-container { margin-top: 25px; padding: 15px; border-radius: 5px; }
    .final-score { font-size: 1.5em; font-weight: bold; text-align: center; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
    .score-high { background-color: #d4edda; color: #155724; }
    .score-medium { background-color: #fff3cd; color: #856404; }
    .score-low { background-color: #f8d7da; color: #721c24; }
    .incorrect-feedback { background-color: #f8d7da; border-left: 4px solid #f5c6cb; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    .incorrect-feedback p { margin: 5px 0; }
</style>
</head>
<body>

<div class="quiz-container">
    <div class="quiz-explanation">
        Testez votre vocabulaire sur la famille et les relations. Lisez chaque définition et choisissez le mot qui correspond.
    </div>

    <form id="quizForm"></form>

    <button id="submit-btn" onclick="checkAnswers()">Voir les résultats</button>

    <div id="results-container"></div>
</div>

<script>
    const quizForm = document.getElementById('quizForm');
    let questionsData = [];

    const questionBank = [
        {
            questionText: "Le frère de mon père est mon...",
            options: ["Oncle", "Cousin", "Neveu"],
            answer: "Oncle",
            explanation: "Le frère de votre père ou de votre mère est votre oncle."
        },
        {
            questionText: "La fille de ma tante est ma...",
            options: ["Nièce", "Sœur", "Cousine"],
            answer: "Cousine",
            explanation: "Les enfants de vos oncles et tantes sont vos cousins et cousines."
        },
        {
            questionText: "Le père de ma mère est mon...",
            options: ["Beau-père", "Grand-père", "Père"],
            answer: "Grand-père",
            explanation: "Le père de votre père ou de votre mère est votre grand-père."
        },
        {
            questionText: "Comment appelle-t-on le père et la mère ensemble ?",
            options: ["Les enfants", "Les grands-parents", "Les parents"],
            answer: "Les parents",
            explanation: "L'ensemble du père et de la mère s'appelle 'les parents'."
        },
        {
            questionText: "Le fils de mon frère est mon...",
            options: ["Neveu", "Petit-fils", "Cousin"],
            answer: "Neveu",
            explanation: "Le fils de votre frère ou de votre sœur est votre neveu."
        },
        {
            questionText: "La mère de mon mari est ma...",
            options: ["Belle-mère", "Grand-mère", "Tante"],
            answer: "Belle-mère",
            explanation: "La mère de votre époux(se) est votre belle-mère."
        },
        {
            questionText: "Quel est le féminin de 'un fils' ?",
            options: ["Une femme", "Une fille", "Une sœur"],
            answer: "Une fille",
            explanation: "Le féminin de 'fils' (son) est 'fille' (daughter)."
        },
        {
            questionText: "Une personne qui travaille avec vous est votre...",
            options: ["Ami", "Collègue", "Connaissance"],
            answer: "Collègue",
            explanation: "Un collègue est une personne de votre environnement professionnel."
        },
        {
            questionText: "La sœur de ma femme est ma...",
            options: ["Belle-sœur", "Cousine", "Nièce"],
            answer: "Belle-sœur",
            explanation: "La sœur de votre époux(se) est votre belle-sœur."
        },
        {
            questionText: "Le fils de ma fille est mon...",
            options: ["Fils", "Neveu", "Petit-fils"],
            answer: "Petit-fils",
            explanation: "Le fils de votre enfant (fils ou fille) est votre petit-fils."
        },
        {
            questionText: "Quel est le masculin de 'la sœur' ?",
            options: ["Le cousin", "Le frère", "L'oncle"],
            answer: "Le frère",
            explanation: "Le masculin de 'sœur' (sister) est 'frère' (brother)."
        },
        {
            questionText: "Le mari de ma mère, qui n'est pas mon père, est mon...",
            options: ["Oncle", "Beau-père", "Grand-père"],
            answer: "Beau-père",
            explanation: "Le terme 'beau-père' s'utilise pour le père de votre conjoint ou pour le nouveau mari de votre mère (stepfather)."
        }
    ];
    
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function generateQuiz() {
        shuffleArray(questionBank);
        questionsData = questionBank.slice(0, 10);
        renderQuestions();
    }

    function renderQuestions() {
        quizForm.innerHTML = '';
        questionsData.forEach((item, index) => {
            shuffleArray(item.options);
            
            const questionBlock = document.createElement('div');
            questionBlock.className = 'question-block';
            
            questionBlock.innerHTML = `
                <p>${index + 1}. ${item.questionText}</p> 
                <div class="options">
                    ${item.options.map(option => `
                        <label>
                            <input type="radio" name="q${index}" value="${option}">
                            ${option}
                        </label>
                    `).join('')}
                </div>
            `;
            quizForm.appendChild(questionBlock);
        });
    }
    
    function checkAnswers() {
        let score = 0;
        let feedbackHTML = '';
        
        questionsData.forEach((item, index) => {
            const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);

            if (selectedOption) {
                if (selectedOption.value === item.answer) {
                    score++;
                } else {
                    feedbackHTML += `
                        <div class="incorrect-feedback">
                            <p><strong>Question ${index + 1} :</strong> "<em>${item.questionText}</em>"</p>
                            <p><strong>Votre réponse :</strong> "${selectedOption.value}". <strong>Réponse correcte :</strong> "${item.answer}".</p>
                            <p><strong>Rétroaction :</strong> ${item.explanation}</p>
                        </div>
                    `;
                }
            } else {
                feedbackHTML += `
                    <div class="incorrect-feedback">
                        <p><strong>Question ${index + 1} :</strong> "<em>${item.questionText}</em>"</p>
                        <p><strong>Vous n'avez pas répondu.</strong> La bonne réponse était : "${item.answer}".</p>
                        <p><strong>Rétroaction :</strong> ${item.explanation}</p>
                    </div>
                `;
            }
        });

        const resultsContainer = document.getElementById('results-container');
        let scoreClass = score >= 8 ? 'score-high' : score >= 6 ? 'score-medium' : 'score-low';
        
        let finalScoreHTML = `<div class="final-score ${scoreClass}">Votre score est de ${score} / ${questionsData.length}</div>`;
        
        if (score < questionsData.length) {
             finalScoreHTML += `<h3>Corrigé des erreurs :</h3>`;
        }
        
        resultsContainer.innerHTML = finalScoreHTML + feedbackHTML;

        document.getElementById('submit-btn').disabled = true;
        document.getElementById('submit-btn').style.backgroundColor = '#6c757d';
        document.getElementById('submit-btn').style.cursor = 'not-allowed';
    }

    window.onload = generateQuiz;
</script>

</body>
</html>
