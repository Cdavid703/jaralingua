<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller: Le Verbe ÊTRE</title>
<style>
    /* Style général pour le conteneur */
    .quiz-container {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        padding: 25px;
        border-radius: 10px;
        max-width: 700px;
        margin: auto;
        border: 1px solid #ddd;
    }
    /* Style pour l'explication initiale */
    .quiz-explanation {
        font-size: 1em;
        color: #333;
        margin-bottom: 25px;
        line-height: 1.5;
        border-left: 4px solid #007bff;
        padding-left: 15px;
        background-color: #e7f3ff;
        padding: 10px 15px;
    }
    /* Style pour chaque bloc de question */
    .question-block {
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid #eee;
        border-radius: 5px;
        background-color: #ffffff;
    }
    .question-block p {
        font-weight: bold;
        margin-bottom: 12px;
        font-size: 1.2em; /* Police un peu plus grande */
        line-height: 1.7;
    }
    .blank {
        font-weight: bold;
        color: #d63333;
        text-decoration: underline;
        text-underline-offset: 4px;
    }
    /* Style pour les options de réponse */
    .options label {
        display: block;
        margin-bottom: 8px;
        cursor: pointer;
        padding: 10px;
        border-radius: 5px;
        transition: background-color 0.2s;
        border: 1px solid #ddd;
    }
    .options label:hover {
        background-color: #f0f0f0;
    }
    .options input[type="radio"] {
        margin-right: 10px;
    }
    /* Style pour le bouton de résultats */
    #submit-btn {
        display: block; width: 100%; padding: 15px; font-size: 1.2em; font-weight: bold;
        color: white; background-color: #28a745; border: none; border-radius: 5px;
        cursor: pointer; margin-top: 20px; transition: background-color 0.3s;
    }
    #submit-btn:hover { background-color: #218838; }
    
    /* Styles pour les résultats */
    #results-container { margin-top: 25px; padding: 15px; border-radius: 5px; }
    .final-score { font-size: 1.5em; font-weight: bold; text-align: center; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
    .score-high { background-color: #d4edda; color: #155724; }
    .score-medium { background-color: #fff3cd; color: #856404; }
    .score-low { background-color: #f8d7da; color: #721c24; }
    .incorrect-feedback { background-color: #f8d7da; border-left: 4px solid #f5c6cb; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    .incorrect-feedback p { margin: 5px 0; }
</style>
</head>
<body>

<div class="quiz-container">
    <div class="quiz-explanation">
        Complétez les phrases suivantes en choisissant la forme correcte du verbe <strong>être</strong> au présent de l'indicatif.
    </div>

    <form id="quizForm"></form>

    <button id="submit-btn" onclick="checkAnswers()">Voir les résultats</button>

    <div id="results-container"></div>
</div>

<script>
    const quizForm = document.getElementById('quizForm');
    let questionsData = [];

    const questionBank = [
        {
            questionText: "Je <span class='blank'>___</span> un étudiant colombien.",
            options: ["suis", "es", "est"],
            answer: "suis",
            explanation: "Pour le pronom 'Je', la conjugaison du verbe être est 'suis'."
        },
        {
            questionText: "Tu <span class='blank'>___</span> fatigué aujourd'hui ?",
            options: ["es", "est", "sont"],
            answer: "es",
            explanation: "Pour le pronom 'Tu', la conjugaison est 'es'."
        },
        {
            questionText: "Elle <span class='blank'>___</span> très intelligente.",
            options: ["est", "es", "sommes"],
            answer: "est",
            explanation: "Pour le pronom 'Elle' (ou 'Il', 'On'), la conjugaison est 'est'."
        },
        {
            questionText: "Nous <span class='blank'>___</span> dans le parc avec des amis.",
            options: ["sommes", "sont", "êtes"],
            answer: "sommes",
            explanation: "Pour le pronom 'Nous', la conjugaison est 'sommes'."
        },
        {
            questionText: "Vous <span class='blank'>___</span> prêts pour le voyage ?",
            options: ["êtes", "sommes", "sont"],
            answer: "êtes",
            explanation: "Pour le pronom 'Vous', la conjugaison est 'êtes'."
        },
        {
            questionText: "Mes amis <span class='blank'>___</span> en vacances en Europe.",
            options: ["sont", "sommes", "est"],
            answer: "sont",
            explanation: "'Mes amis' peut être remplacé par 'Ils', donc la conjugaison est 'sont'."
        },
        {
            questionText: "Je <span class='blank'>___</span> certain que c'est la bonne réponse.",
            options: ["suis", "suie", "es"],
            answer: "suis",
            explanation: "Avec 'Je', on utilise toujours 'suis'."
        },
        {
            questionText: "Où <span class='blank'>___</span>-tu en ce moment ?",
            options: ["es", "est", "êtes"],
            answer: "es",
            explanation: "Le sujet de la phrase est 'tu', donc la conjugaison correcte est 'es'."
        },
        {
            questionText: "On <span class='blank'>___</span> très contents de te voir !",
            options: ["est", "sommes", "sont"],
            answer: "est",
            explanation: "Le pronom 'On' se conjugue toujours comme 'Il' ou 'Elle', donc on utilise 'est'."
        },
        {
            questionText: "Sophie et Marie <span class='blank'>___</span> françaises.",
            options: ["sont", "est", "êtes"],
            answer: "sont",
            explanation: "'Sophie et Marie' peut être remplacé par 'Elles', donc la conjugaison est 'sont'."
        }
    ];
    
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function generateQuiz() {
        questionsData = questionBank; // Pas de mélange pour avoir toutes les formes
        renderQuestions();
    }

    function renderQuestions() {
        quizForm.innerHTML = '';
        questionsData.forEach((item, index) => {
            shuffleArray(item.options);
            
            const questionBlock = document.createElement('div');
            questionBlock.className = 'question-block';
            
            questionBlock.innerHTML = `
                <p>${index + 1}. ${item.questionText}</p> 
                <div class="options">
                    ${item.options.map(option => `
                        <label>
                            <input type="radio" name="q${index}" value="${option}">
                            ${option}
                        </label>
                    `).join('')}
                </div>
            `;
            quizForm.appendChild(questionBlock);
        });
    }
    
    function checkAnswers() {
        let score = 0;
        let feedbackHTML = '';
        
        questionsData.forEach((item, index) => {
            const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);
            // Pour afficher la phrase complète dans la rétroaction
            const fullSentence = item.questionText.replace("<span class='blank'>___</span>", `<strong>${item.answer}</strong>`);

            if (selectedOption) {
                if (selectedOption.value === item.answer) {
                    score++;
                } else {
                    feedbackHTML += `
                        <div class="incorrect-feedback">
                            <p><strong>Question ${index + 1} :</strong></p>
                            <p><strong>Votre réponse :</strong> "${selectedOption.value}". <strong>Réponse correcte :</strong> "${item.answer}".</p>
                            <p><strong>Explication :</strong> ${item.explanation}</p>
                            <p><em>Phrase correcte : ${fullSentence}</em></p>
                        </div>
                    `;
                }
            } else {
                feedbackHTML += `
                    <div class="incorrect-feedback">
                        <p><strong>Question ${index + 1} :</strong></p>
                        <p><strong>Vous n'avez pas répondu.</strong> La bonne réponse était : "${item.answer}".</p>
                        <p><strong>Explication :</strong> ${item.explanation}</p>
                        <p><em>Phrase correcte : ${fullSentence}</em></p>
                    </div>
                `;
            }
        });

        const resultsContainer = document.getElementById('results-container');
        let scoreClass = score >= 8 ? 'score-high' : score >= 6 ? 'score-medium' : 'score-low';
        
        let finalScoreHTML = `<div class="final-score ${scoreClass}">Votre score est de ${score} / ${questionsData.length}</div>`;
        
        if (score < questionsData.length) {
             finalScoreHTML += `<h3>Corrigé des erreurs :</h3>`;
        }
        
        resultsContainer.innerHTML = finalScoreHTML + feedbackHTML;

        document.getElementById('submit-btn').disabled = true;
        document.getElementById('submit-btn').style.backgroundColor = '#6c757d';
        document.getElementById('submit-btn').style.cursor = 'not-allowed';
    }

    window.onload = generateQuiz;
</script>

</body>
</html>
