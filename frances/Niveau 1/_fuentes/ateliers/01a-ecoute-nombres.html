<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller de Números en Francés</title>
<style>
    /* Style général pour le conteneur */
    .quiz-container {
        font-family: Arial, sans-serif;
        background-color: #f9f9f9;
        padding: 25px;
        border-radius: 10px;
        max-width: 700px;
        margin: auto;
        border: 1px solid #ddd;
    }
    /* Style pour l'explication initiale */
    .quiz-explanation {
        font-size: 1em;
        color: #333;
        margin-bottom: 25px;
        line-height: 1.5;
        border-left: 4px solid #007bff;
        padding-left: 15px;
        background-color: #e7f3ff;
        padding: 10px 15px;
    }
    /* Style pour chaque bloc de question */
    .question-block {
        margin-bottom: 20px;
        padding: 15px;
        border: 1px solid #eee;
        border-radius: 5px;
        background-color: #ffffff;
        display: flex;
        align-items: center;
        gap: 15px;
    }
    /* NOUVEAU : Style pour le numéro de la question */
    .question-number {
        font-size: 1.5em;
        font-weight: bold;
        color: #005a9e;
        width: 40px;
        text-align: center;
        flex-shrink: 0;
    }
    /* Style pour le bouton audio */
    .play-audio-btn {
        font-size: 2em;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 50%;
        width: 60px;
        height: 60px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: background-color 0.2s;
        flex-shrink: 0;
    }
    .play-audio-btn:hover {
        background-color: #0056b3;
    }
    /* Style pour les options de réponse */
    .options {
        width: 100%;
    }
    .options label {
        display: block;
        margin-bottom: 8px;
        cursor: pointer;
        padding: 10px;
        border-radius: 5px;
        transition: background-color 0.2s;
        border: 1px solid #ddd;
    }
    .options label:hover {
        background-color: #f0f0f0;
    }
    .options input[type="radio"] {
        margin-right: 10px;
    }
    /* Style pour le bouton de résultats */
    #submit-btn {
        display: block; width: 100%; padding: 15px; font-size: 1.2em; font-weight: bold;
        color: white; background-color: #28a745; border: none; border-radius: 5px;
        cursor: pointer; margin-top: 20px; transition: background-color 0.3s;
    }
    #submit-btn:hover { background-color: #218838; }
    
    /* Styles pour les résultats */
    #results-container { margin-top: 25px; padding: 15px; border-radius: 5px; }
    .final-score { font-size: 1.5em; font-weight: bold; text-align: center; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
    .score-high { background-color: #d4edda; color: #155724; }
    .score-medium { background-color: #fff3cd; color: #856404; }
    .score-low { background-color: #f8d7da; color: #721c24; }
    .incorrect-feedback { background-color: #f8d7da; border-left: 4px solid #f5c6cb; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    .incorrect-feedback p { margin: 5px 0; }
</style>
</head>
<body>

<div class="quiz-container">
    <div class="quiz-explanation">
        Écoutez attentivement le numéro prononcé en français, puis sélectionnez la bonne réponse écrite. Cliquez sur le bouton 🔊 pour écouter chaque numéro.
    </div>

    <form id="quizForm"></form>

    <button id="submit-btn" onclick="checkAnswers()">Voir les résultats</button>

    <div id="results-container"></div>
</div>

<script>
    const quizForm = document.getElementById('quizForm');
    const questionCount = 10;
    let questionsData = [];
    let frenchVoice = null;

    function setFrenchVoice() {
        const voices = speechSynthesis.getVoices();
        frenchVoice = voices.find(voice => voice.lang === 'fr-FR' || voice.lang.startsWith('fr-'));
    }
    speechSynthesis.onvoiceschanged = setFrenchVoice;
    setFrenchVoice();

    // --- MODIFIÉ : Fonction audio améliorée ---
    function playAudio(textToSpeak) {
        speechSynthesis.cancel();
        
        // L'audio ne dit plus que le numéro.
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'fr-FR';
        
        // Vitesse réduite pour une meilleure clarté.
        utterance.rate = 0.8;
        // Ton neutre.
        utterance.pitch = 1;

        if (frenchVoice) {
            utterance.voice = frenchVoice;
        }
        
        speechSynthesis.speak(utterance);
    }

    // --- NOUVEAU : Fonction pour mettre la première lettre en majuscule ---
    function capitalizeFirstLetter(string) {
        return string.charAt(0).toUpperCase() + string.slice(1);
    }

    // --- Générateur de Nombres ---
    function numberToFrenchWords(num) {
        if (num > 100 || num < 1) return "";
        const units = ["", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf"];
        const teens = ["dix", "onze", "douze", "treize", "quatorze", "quinze", "seize", "dix-sept", "dix-huit", "dix-neuf"];
        const tens = ["", "dix", "vingt", "trente", "quarante", "cinquante", "soixante", "soixante-dix", "quatre-vingt", "quatre-vingt-dix"];

        if (num === 100) return "cent";
        if (num < 10) return units[num];
        if (num < 20) return teens[num - 10];
        
        let ten = Math.floor(num / 10);
        let unit = num % 10;

        if (num >= 70 && num < 80) { return "soixante-" + (unit === 1 ? "et-" : "") + teens[num - 70]; }
        if (num >= 90 && num < 100) { return "quatre-vingt-" + teens[num - 90]; }

        let tenWord = tens[ten];
        let unitWord = units[unit];

        if (num === 80) return "quatre-vingts";
        if (ten === 8) tenWord = "quatre-vingt";

        if (unit === 0) return tenWord;
        if (unit === 1 && num !== 81 && num !== 91) return `${tenWord}-et-${unitWord}`;
        
        return `${tenWord}-${unitWord}`;
    }

    function generateDistractors(correctNumber) {
        let distractors = new Set();
        while (distractors.size < 2) {
            let offset = Math.random() < 0.5 ? 5 : -5;
            let distractorNum = correctNumber + Math.floor(Math.random() * offset);
            
            if (distractorNum > 0 && distractorNum <= 100 && distractorNum !== correctNumber) {
                distractors.add(numberToFrenchWords(distractorNum));
            } else {
                let randomDistractor;
                do { randomDistractor = Math.floor(Math.random() * 100) + 1; } 
                while (randomDistractor === correctNumber);
                distractors.add(numberToFrenchWords(randomDistractor));
            }
        }
        return Array.from(distractors);
    }
    
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function generateQuiz() {
        let randomNumbers = new Set();
        while (randomNumbers.size < questionCount) {
            randomNumbers.add(Math.floor(Math.random() * 100) + 1);
        }

        questionsData = Array.from(randomNumbers).map(num => {
            // MODIFIÉ : On met les réponses en majuscule ici
            const correctAnswerText = capitalizeFirstLetter(numberToFrenchWords(num));
            const distractors = generateDistractors(num).map(d => capitalizeFirstLetter(d));
            let options = [correctAnswerText, ...distractors];
            shuffleArray(options);
            return {
                number: num,
                correctAnswer: correctAnswerText,
                options: options
            };
        });

        renderQuestions();
    }

    // --- MODIFIÉ : Affiche les questions avec leur numéro ---
    function renderQuestions() {
        quizForm.innerHTML = '';
        questionsData.forEach((item, index) => {
            const questionBlock = document.createElement('div');
            questionBlock.className = 'question-block';
            
            // On passe le TEXTE à la fonction playAudio et on ajoute le numéro
            questionBlock.innerHTML = `
                <div class="question-number">${index + 1}.</div>
                <button type="button" class="play-audio-btn" onclick="playAudio('${item.correctAnswer.replace(/'/g, "\\'")}')">🔊</button>
                <div class="options">
                    ${item.options.map(option => `
                        <label>
                            <input type="radio" name="q${index}" value="${option}">
                            ${option}
                        </label>
                    `).join('')}
                </div>
            `;
            quizForm.appendChild(questionBlock);
        });
    }
    
    // --- Vérification des réponses ---
    function checkAnswers() {
        let score = 0;
        let feedbackHTML = '';
        
        questionsData.forEach((item, index) => {
            const selectedOption = document.querySelector(`input[name="q${index}"]:checked`);

            if (selectedOption) {
                if (selectedOption.value === item.correctAnswer) {
                    score++;
                } else {
                    feedbackHTML += `
                        <div class="incorrect-feedback">
                            <p><strong>Question ${index + 1}:</strong> Vous avez répondu "<em>${selectedOption.value}</em>".</p>
                            <p><strong>La bonne réponse était :</strong> "${item.correctAnswer}".</p>
                        </div>
                    `;
                }
            } else {
                feedbackHTML += `
                    <div class="incorrect-feedback">
                        <p><strong>Question ${index + 1}:</strong> Vous n'avez pas répondu.</p>
                        <p><strong>La bonne réponse était :</strong> "${item.correctAnswer}".</p>
                    </div>
                `;
            }
        });

        const resultsContainer = document.getElementById('results-container');
        let scoreClass = score >= 8 ? 'score-high' : score >= 5 ? 'score-medium' : 'score-low';
        
        let finalScoreHTML = `<div class="final-score ${scoreClass}">Votre score est de ${score} / ${questionCount}</div>`;
        resultsContainer.innerHTML = finalScoreHTML + feedbackHTML;

        document.getElementById('submit-btn').disabled = true;
        document.getElementById('submit-btn').style.backgroundColor = '#6c757d';
        document.getElementById('submit-btn').style.cursor = 'not-allowed';
    }

    window.onload = generateQuiz;
</script>

</body>
</html>
