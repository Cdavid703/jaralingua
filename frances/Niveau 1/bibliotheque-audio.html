<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bibliothèque audio | Français Niveau 1</title>
  <link href="../../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="../../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../../assets/vendor/fonts/jaralingua-fonts.css" rel="stylesheet">
  <link href="assets/niveau1.css?v=20260626" rel="stylesheet">
  <style>
    .teacher-only{display:none!important}.can-view-transcripts .teacher-only{display:inline-flex!important}
    .teacher-note{display:none;color:var(--muted);font-weight:800}.can-view-transcripts .teacher-note{display:block}
  </style>
</head>
<body>
  <nav class="navbar fixed-top">
    <div class="container">
      <a class="navbar-brand" href="index.html"><img class="brand-logo" src="../../assets/img/jaralingua-logo.png" alt="JaraLingua"><span>Français · Niveau 1</span></a>
      <a class="nav-link" href="ateliers-activites.html">Ateliers</a>
    </div>
  </nav>
  <header class="hero lesson-hero" style="--hero-image:url('/frances/Niveau%201/img/portail/bibliotheque-audio.png')">
    <div class="container">
      <span class="badge-course"><i class="bi bi-headphones"></i> Écoute A1.1</span>
      <h1>Bibliothèque audio</h1>
      <p class="hero-text">Documents audio professionnels avec questionnaires et transcriptions réservées au professeur ou à l’administrateur.</p>
      <p class="teacher-note mt-3">Accès professeur/admin détecté : les boutons de transcription PDF sont disponibles.</p>
    </div>
  </header>
  <main><section><div class="container"><div class="audio-list" id="audioLibrary"></div></div></section></main>
  <footer class="footer"><div class="container"><a href="index.html">← Retour au portail</a></div></footer>

  <script src="../../assets/js/transcript-pdf.js"></script>
  <script src="assets/quiz-catalog.js?v=20260625"></script>
  <script src="assets/original-banks.js?v=20260625"></script>
  <script src="assets/expanded-catalog.js?v=20260626-transcripts"></script>
  <script>
    const audioKeys = [
      ["1","premiere-rencontre"],
      ["2","ecoute-verbes-er"],
      ["3","ecoute-verbes-essentiels"],
      ["4","ecoute-ma-famille"],
      ["5","ecoute-portrait"]
    ];
    const library = document.getElementById("audioLibrary");
    library.innerHTML = audioKeys.map(([number,key]) => {
      const item = window.quizCatalog[key];
      return `<article class="audio-card">
        <span class="skill-pill">Thème ${number}</span>
        <h2 class="h4 mt-3">${item.title}</h2>
        <p>${item.description}</p>
        <audio controls preload="metadata" src="${item.audio.replace("../","")}"></audio>
        <div class="d-flex flex-wrap gap-2 mt-3">
          <a class="btn-main" href="ateliers/quiz.html?activite=${key}">Ouvrir les questions</a>
          <button class="btn-soft teacher-only" type="button" data-transcript-key="${key}"><i class="bi bi-file-earmark-pdf"></i> Transcription professeur</button>
        </div>
      </article>`;
    }).join("");

    function readUser(){
      const keys = ["jaralingua_google_user","jaralingua_microsoft_user"];
      for (const key of keys) {
        try {
          const user = JSON.parse(sessionStorage.getItem(key) || "null");
          if (user && (!user.exp || Date.now() / 1000 <= user.exp)) return user;
        } catch (_error) {}
      }
      return null;
    }
    function normalizeEmail(email){ return String(email || "").trim().toLowerCase(); }
    function userId(user){ return (user && (user.sub || user.email)) || ""; }
    function canSeeTranscript(){
      const user = readUser();
      if (!user) return false;
      const email = normalizeEmail(user.email);
      if (email === "cdavid.jaramillo@gmail.com" || email === "lcvelasqueza@correo.iue.edu.co") return true;
      try {
        const requests = JSON.parse(localStorage.getItem("jaralingua_role_requests") || "[]");
        const id = userId(user);
        return Array.isArray(requests) && requests.some((request) =>
          request.status === "approved" &&
          (request.role === "teacher" || request.role === "admin") &&
          (request.id === id || normalizeEmail(request.email) === email)
        );
      } catch (_error) { return false; }
    }
    function updateTranscriptAccess(){ document.body.classList.toggle("can-view-transcripts", canSeeTranscript()); }
    document.addEventListener("click", (event) => {
      const button = event.target.closest("[data-transcript-key]");
      if (!button || !canSeeTranscript()) return;
      const item = window.quizCatalog[button.dataset.transcriptKey];
      if (!item?.transcript) return;
      const safeTitle = item.title.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
      downloadTranscriptPdf(item.title, item.transcript, `transcription-niveau1-${safeTitle}.pdf`);
    });
    updateTranscriptAccess();
    window.addEventListener("storage", updateTranscriptAccess);
    window.addEventListener("focus", updateTranscriptAccess);
    let checks = 0;
    const timer = setInterval(() => { updateTranscriptAccess(); checks += 1; if (checks > 12) clearInterval(timer); }, 800);
  </script>
  <script src="assets/niveau1.js?v=20260626"></script>
</body>
</html>
